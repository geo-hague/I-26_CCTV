<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>I-26 CCTV</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; font-family: sans-serif;
            overflow: hidden; /* Prevents all accidental scrolling */
        }

        body {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .video-grid {
            display: grid;
            width: 100%;
            height: 100vh; /* fallback for browsers without dvh support */
            height: 100dvh; /* actual visible viewport, accounts for mobile browser chrome */
            gap: 6px; 
            padding: 6px;
        }

        /* --- HARD-LOCKED VIEWPORT GRID MATCHING --- */

        /* Desktop Layout -> 3x3 Grid forced to fit screen height */
        @media (min-width: 768px) {
            .video-grid { 
                grid-template-columns: repeat(3, 1fr); 
                grid-template-rows: repeat(3, 1fr); 
            }
        }

        /* Mobile Layout -> 3 Rows vertical stack forced to fit screen height */
        @media (max-width: 767px) {
            .video-grid { 
                grid-template-columns: 1fr; 
                grid-template-rows: repeat(3, 1fr); 
            }
        }

        .video-wrapper { 
            position: relative; 
            width: 100%; 
            height: 100%; /* Spans exactly to fill its grid track fraction */
            background: #111; 
            overflow: hidden;
            border-radius: 4px;
        }
        
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; /* Keeps 16:9 ratio clean with pillarboxes if ratios conflict */
            display: block; 
        }
        
        /* Low-Profile Navigation Buttons */
        .nav-btn {
            position: fixed; 
            top: 50%; 
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4); 
            color: rgba(255, 255, 255, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px 10px; 
            font-size: 20px; 
            cursor: pointer; 
            z-index: 10;
            transition: background 0.2s, color 0.2s, border-color 0.2s; 
            user-select: none; 
            border-radius: 4px;
        }
        
        .nav-btn:hover { 
            background: rgba(0, 0, 0, 0.8); 
            color: #fff;
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .nav-btn.hidden { display: none; }
        #prev-btn { left: 2px; }  
        #next-btn { right: 2px; }

        @media (max-width: 767px) {
            .nav-btn {
                padding: 14px 8px;
                font-size: 15px;
                background: rgba(0, 0, 0, 0.3);
                color: rgba(255, 255, 255, 0.6);
            }
        }
    </style>
</head>
<body>

    <button id="next-btn" class="nav-btn hidden">East &rarr;</button>
    <div id="grid" class="video-grid"></div>

    <script>

  "chan-6275_l": "cff77af64a4aa696010b5ff1ff029cf8b92054709b0e15eb1a0fa542a06712fb", // Tracey Grove
  "chan-6276_l": "c63809b8cf1150ca3fba8df10a3829a764cce469875de20a189cb48597b8a7e6", // Upward Rd

  "chan-5444_l": "926e4be382c546025404143fe1476641a10288bb892c1df177ffcb42ee16ccf8", // MM 64.5
  "chan-5446_l": "6840ab38cd5b1477fcf2a447f8d09bbae17d147397a69fab461dd1d3ff14af15", // Exit 67
  "chan-5445_l": "45700646bb89bd323b8a6f881ed3003cf17492934ba56860f7c71d8ebbc16c6a", // US-74/NC-108
  "updated": "2026-11-16 15:08:41 UTC"

        // --- END TOKENS ---

        const cameraChannels = [
            { host: "cfase02", chan: "chan-5373_l" },
            { host: "cfase03", chan: "chan-5374_l" },
            { host: "cfase04", chan: "chan-5375_l" },
            { host: "cfase05", chan: "chan-6880_l" },
            { host: "cfsse11", chan: "chan-5376_l" },
            { host: "cfase06", chan: "chan-6447_l" },
            { host: "cfase01", chan: "chan-6881_l" },
            { host: "cfase01", chan: "chan-5378_l" },
            { host: "cfase02", chan: "chan-6332_l" },
            { host: "cfase04", chan: "chan-5381_l" },
            { host: "cfase04", chan: "chan-5432_l" },
            { host: "cfase03", chan: "chan-5440_l" },
            { host: "cfsse13", chan: "chan-5441_l" },
            { host: "cfase03", chan: "chan-6279_l" },
            { host: "cfase05", chan: "chan-6446_l" },
            { host: "cfase02", chan: "chan-5443_l" },
            { host: "cfase01", chan: "chan-6275_l" },
            { host: "cfase03", chan: "chan-6276_l" },
            { host: "cfsse05", chan: "chan-6327_l" },
            { host: "cfsse05", chan: "chan-6328_l" },
            { host: "cfsse03", chan: "chan-5444_l" },
            { host: "cfase03", chan: "chan-5446_l" },
            { host: "cfase05", chan: "chan-5445_l" },
        ];

        const cameraSources = cameraChannels.map(cam =>
            `https://${cam.host}.services.ncdot.gov:8887/${cam.chan}/index.m3u8?token=${tokenConfig[cam.chan]}`
        );

        const isMobile = window.innerWidth < 768;
        const CAMS_PER_PAGE = isMobile ? 3 : 9; 
        
        let currentPage = 0;
        let activeHlsInstances = [];

        const gridEl  = document.getElementById('grid');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function destroyCurrentStreams() {
            activeHlsInstances.forEach(hls => { hls.detachMedia(); hls.destroy(); });
            activeHlsInstances = [];
            gridEl.querySelectorAll('video').forEach(v => { v.pause(); v.src = ""; v.load(); });
            gridEl.innerHTML = '';
        }

        function loadPage(pageNumber) {
            destroyCurrentStreams();

            const start = pageNumber * CAMS_PER_PAGE;
            const pageStreams = cameraSources.slice(start, start + CAMS_PER_PAGE);

            pageStreams.forEach(source => {
                const wrapper = document.createElement('div');
                wrapper.className = 'video-wrapper';
                const video = document.createElement('video');
                
                video.muted = true;
                video.autoplay = true;
                video.controls = true;
                video.setAttribute('playsinline', 'true');
                video.setAttribute('webkit-playsinline', 'true');
                
                wrapper.appendChild(video);
                gridEl.appendChild(wrapper);

                if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                    const hls = new Hls({ maxBufferLength: 6, lowLatencyMode: true });
                    hls.loadSource(source);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(err => console.log("Autoplay blocked:", err));
                    });
                    activeHlsInstances.push(hls);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = source;
                    video.addEventListener('loadedmetadata', () => {
                        video.play().catch(err => console.log("Autoplay blocked:", err));
                    });
                }
            });
            updateNavButtons();
        }

        function updateNavButtons() {
            const totalPages = Math.ceil(cameraSources.length / CAMS_PER_PAGE);
            currentPage > 0 ? prevBtn.classList.remove('hidden') : prevBtn.classList.add('hidden');
            currentPage < totalPages - 1 ? nextBtn.classList.remove('hidden') : nextBtn.classList.add('hidden');
        }

        prevBtn.addEventListener('click', () => { if (currentPage > 0) { currentPage--; loadPage(currentPage); } });
        nextBtn.addEventListener('click', () => {
            if (currentPage < Math.ceil(cameraSources.length / CAMS_PER_PAGE) - 1) { currentPage++; loadPage(currentPage); }
        });

        document.addEventListener("DOMContentLoaded", () => loadPage(currentPage));
    </script>
</body>
</html>
